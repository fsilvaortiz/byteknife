name: Error
description: Algo no funciona como debería.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Si el error filtra datos fuera del navegador, no lo reportes aquí: sigue [SECURITY.md](https://github.com/fsilvaortiz/byteknife/blob/main/SECURITY.md).
        No pegues datos reales o sensibles (tokens, contraseñas, datos personales); usa un ejemplo inventado.
  - type: input
    id: tool
    attributes:
      label: Herramienta o página
      placeholder: https://byteknife.dev/es/jwt/
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Pego este texto: ...
        2. Presiono ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas y qué pasó
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador y sistema
      placeholder: Firefox 140 en macOS
