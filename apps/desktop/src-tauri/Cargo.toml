[package]
name = "byteknife"
version = "0.1.0"
description = "ByteKnife para Mac: utilidades para desarrolladores que corren en tu máquina."
authors = ["Fabián Silva Ortiz"]
license = "MIT"
repository = "https://github.com/fsilvaortiz/byteknife"
edition = "2021"
rust-version = "1.85"

[lib]
name = "byteknife_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-fs = "=2.7.1"
tauri-plugin-http = { version = "=2.8.3", features = ["cookies", "dangerous-settings", "unsafe-headers"] }
tauri-plugin-process = "=2.4.0"
tauri-plugin-updater = "=2.14.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
